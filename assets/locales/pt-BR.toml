login-why = "{harness} faz login com uma chave de API do Google AI Studio (aistudio.google.com/app/apikey). O QCode abre um contêiner a partir da imagem deste perfil e roda a ferramenta em um terminal abaixo, onde ela pede a chave e mais nada. Nada da sua máquina está nesse contêiner."
