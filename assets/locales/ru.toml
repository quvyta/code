slim-detail = "opencode с oh-my-opencode-slim — более лёгкой командой агентов, чем oh-my-openagent, который этот шаблон не устанавливает. Семь агентов (orchestrator, explorer, oracle, council, librarian, designer, fixer), все работают на модели, с которой входит этот профиль. В комплекте graphify, а opencode настраивается так же, как в любом шаблоне QCode: проверка обновлений выключена, первые вопросы отвечены, запросов разрешений нет. Сам по себе он никуда ничего не отправляет. Ни один файл вашего рабочего пространства не меняется."
