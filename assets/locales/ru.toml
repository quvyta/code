[profiles.gemini]
closed-title = "Google закрыла вход в {name}"
closed = "Google закрыла вход в Gemini CLI через аккаунт Google для личных аккаунтов: теперь Gemini отвечает «This client is no longer supported for Gemini Code Assist for individuals». Для Gemini Code Assist Standard и Enterprise всё по-прежнему работает. С личным аккаунтом остаются такие варианты: профиль Antigravity IDE, который работает в QCode, или новый профиль Gemini CLI с ключом API из Google AI Studio."
login-why = "{harness} входит с ключом API из Google AI Studio (aistudio.google.com/app/apikey). QCode открывает контейнер из образа этого профиля и запускает инструмент в терминале ниже — там он спрашивает ключ и больше ничего. В этом контейнере нет ничего с вашей машины."
login-what = "Выберите Use Gemini API Key, вставьте ключ и нажмите enter. Когда инструмент покажет приглашение, нажмите кнопку под ним — или просто выйдите из инструмента."
