slim-offline = "У контейнеров этого профиля нет сети, поэтому context7 и grep.app из oh-my-opencode-slim не отвечают. graphify и агенты работают и без неё."
summary-base = "как есть"
recommended-detail = "Инструмент настроен так, как советуют его создатели и QCode: проверки обновлений и отчёты об использовании выключены, на его первые вопросы уже даны ответы, вопросов о разрешениях нет. Карта кода от graphify идёт в комплекте — она настроена в собственных настройках инструмента, как и плагины, рекомендованные для этого инструмента. Файлы вашего рабочего пространства не затрагиваются."
extra-detail = "Рекомендация QCode и больше: для Claude Code — все остальные плагины, с которыми работает автор QCode. Инструкции graphify и QCode записаны в файл инструкций рабочего пространства, так что агенты одного рабочего пространства могут связаться друг с другом."
